name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v5
        with:
          path: /nix/store
          key: nix-v2-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build hathor-core
        run: nix develop --command bash ./scripts/build-hathor-core.sh

      - name: Build cpuminer
        run: nix develop --command bash ./scripts/build-cpuminer.sh

      - name: Build wallet-headless
        run: nix develop --command bash ./scripts/build-wallet-headless.sh

      - name: Build tx-mining-service
        run: nix develop --command bash ./scripts/build-tx-mining-service.sh

      - name: Build explorer
        run: nix develop --command bash ./scripts/build-explorer.sh

      - name: Bundle Node.js binary
        run: nix develop --command bash ./scripts/build-node.sh

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build Tauri app
        run: nix develop --command npm run tauri build -- --bundles deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v5
        with:
          path: /nix/store
          key: nix-v2-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build hathor-core
        run: nix develop --command bash ./scripts/build-hathor-core.sh

      - name: Build cpuminer
        run: nix develop --command bash ./scripts/build-cpuminer.sh

      - name: Build wallet-headless
        run: nix develop --command bash ./scripts/build-wallet-headless.sh

      - name: Build tx-mining-service
        run: nix develop --command bash ./scripts/build-tx-mining-service.sh

      - name: Build explorer
        run: nix develop --command bash ./scripts/build-explorer.sh

      - name: Bundle Node.js binary
        run: nix develop --command bash ./scripts/build-node.sh

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build Tauri app
        run: nix develop --command npm run tauri build -- --bundles app

      - name: Create DMG
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/')
          APP_PATH="src-tauri/target/release/bundle/macos/Hathor Forge.app"
          DMG_PATH="src-tauri/target/release/bundle/Hathor Forge_${VERSION}_aarch64.dmg"
          hdiutil create -volname "Hathor Forge" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            src-tauri/target/release/bundle/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          # Bump the suffix whenever VCPKG_PIN_SHA in scripts/windows/build-hathor-core.ps1 changes.
          # Current pin: 9b4f30e0 (Feb 4 2026, rocksdb 10.10.1).
          key: vcpkg-${{ runner.os }}-rocksdb-9b4f30e0-static-md

      - name: Install MSYS2 (for cpuminer autotools)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl
            autoconf
            automake
            libtool
            make

      - name: Clone dependency repositories
        shell: pwsh
        # SHAs must match flake.lock. Linux/macOS get these via Nix inputs;
        # Windows doesn't use Nix, so we pin the same commits manually here
        # to keep cross-platform builds reproducible.
        env:
          HATHOR_CORE_SHA:        e3bba0da013b27f87d64a9ca5f9dacdd0b16e512
          CPUMINER_SHA:           06240a0bd91f178aa135090ada3497992e7c1ec0
          WALLET_HEADLESS_SHA:    f79695366c753a184478a1a0d7309ff48c45eb3a
          TX_MINING_SERVICE_SHA:  a677e3b737fbc7013d191bb22987fed1c6bf40f8
          HATHOR_EXPLORER_SHA:    51a0ed053998b44e0b465bdffe385e3a4c0f580d
        run: |
          function Clone-Pinned($url, $dir, $sha) {
            git clone --filter=blob:none --no-checkout $url $dir
            git -C $dir fetch --depth 1 origin $sha
            git -C $dir checkout $sha
          }
          Clone-Pinned https://github.com/HathorNetwork/hathor-core.git           ..\hathor-core           $env:HATHOR_CORE_SHA
          Clone-Pinned https://github.com/HathorNetwork/cpuminer.git              ..\cpuminer              $env:CPUMINER_SHA
          Clone-Pinned https://github.com/HathorNetwork/hathor-wallet-headless.git ..\hathor-wallet-headless $env:WALLET_HEADLESS_SHA
          Clone-Pinned https://github.com/HathorNetwork/tx-mining-service.git     ..\tx-mining-service     $env:TX_MINING_SERVICE_SHA
          Clone-Pinned https://github.com/HathorNetwork/hathor-explorer.git       ..\hathor-explorer       $env:HATHOR_EXPLORER_SHA

      - name: Build hathor-core (Windows)
        shell: pwsh
        run: .\scripts\windows\build-hathor-core.ps1

      - name: Build cpuminer (Windows/MSYS2)
        shell: msys2 {0}
        run: |
          export CPUMINER_SRC="$(cygpath -u "$GITHUB_WORKSPACE/../cpuminer")"
          bash ./scripts/windows/build-cpuminer.sh

      - name: Build wallet-headless (Windows)
        shell: pwsh
        run: .\scripts\windows\build-wallet-headless.ps1

      - name: Build tx-mining-service (Windows)
        shell: pwsh
        run: .\scripts\windows\build-tx-mining-service.ps1

      - name: Build explorer (Windows)
        shell: pwsh
        run: .\scripts\windows\build-explorer.ps1

      - name: Bundle Node.js binary (Windows)
        shell: pwsh
        run: .\scripts\windows\build-node.ps1

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        env:
          TAG_NAME: ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release-artifacts/linux-release/**/*
            release-artifacts/macos-release/**/*
            release-artifacts/windows-release/**/*
