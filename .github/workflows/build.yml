name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-v2-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build hathor-core
        run: nix develop --command bash ./scripts/build-hathor-core.sh

      - name: Build cpuminer
        run: nix develop --command bash ./scripts/build-cpuminer.sh

      - name: Build wallet-headless
        run: nix develop --command bash ./scripts/build-wallet-headless.sh

      - name: Build tx-mining-service
        run: nix develop --command bash ./scripts/build-tx-mining-service.sh

      - name: Build explorer
        run: nix develop --command bash ./scripts/build-explorer.sh

      - name: Bundle Node.js binary
        run: nix develop --command bash ./scripts/build-node.sh

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build Tauri app
        run: nix develop --command npm run tauri build -- --bundles deb

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bundle
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-v2-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build hathor-core
        run: nix develop --command bash ./scripts/build-hathor-core.sh

      - name: Build cpuminer
        run: nix develop --command bash ./scripts/build-cpuminer.sh

      - name: Build wallet-headless
        run: nix develop --command bash ./scripts/build-wallet-headless.sh

      - name: Build tx-mining-service
        run: nix develop --command bash ./scripts/build-tx-mining-service.sh

      - name: Build explorer
        run: nix develop --command bash ./scripts/build-explorer.sh

      - name: Bundle Node.js binary
        run: nix develop --command bash ./scripts/build-node.sh

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Build Tauri app
        run: nix develop --command npm run tauri build -- --bundles app

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-bundle
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-rocksdb-v4-static-md

      - name: Install MSYS2 (for cpuminer autotools)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl
            autoconf
            automake
            libtool
            make

      - name: Clone dependency repositories
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/HathorNetwork/hathor-core.git ..\hathor-core
          git clone --depth 1 https://github.com/HathorNetwork/cpuminer.git ..\cpuminer
          git clone --depth 1 https://github.com/HathorNetwork/hathor-wallet-headless.git ..\hathor-wallet-headless
          git clone --depth 1 https://github.com/HathorNetwork/tx-mining-service.git ..\tx-mining-service
          git clone --depth 1 https://github.com/HathorNetwork/hathor-explorer.git ..\hathor-explorer

      - name: Build hathor-core (Windows)
        shell: pwsh
        run: .\scripts\windows\build-hathor-core.ps1

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-rocksdb-v4-static-md

      - name: Build cpuminer (Windows/MSYS2)
        shell: msys2 {0}
        run: |
          export CPUMINER_SRC="$(cygpath -u "$GITHUB_WORKSPACE/../cpuminer")"
          bash ./scripts/windows/build-cpuminer.sh

      - name: Build wallet-headless (Windows)
        shell: pwsh
        run: .\scripts\windows\build-wallet-headless.ps1

      - name: Build tx-mining-service (Windows)
        shell: pwsh
        run: .\scripts\windows\build-tx-mining-service.ps1

      - name: Build explorer (Windows)
        shell: pwsh
        run: .\scripts\windows\build-explorer.ps1

      - name: Bundle Node.js binary (Windows)
        shell: pwsh
        run: .\scripts\windows\build-node.ps1

      - name: Install npm dependencies
        run: npm ci

      - name: Inspect hathor-core onedir before Tauri build
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $onedir = "src-tauri\binaries\hathor-core-$target"
          Write-Host "=== hathor-core onedir structure ==="
          Write-Host "Top-level:"
          Get-ChildItem $onedir | Select-Object Name, Length, PSIsContainer | Format-Table -AutoSize
          Write-Host ""
          Write-Host "=== _internal directory ==="
          $internal = "$onedir\_internal"
          if (Test-Path $internal) {
            $all = Get-ChildItem $internal
            Write-Host "Total entries: $($all.Count)"
            Write-Host ""
            Write-Host "Subdirectories:"
            $all | Where-Object { $_.PSIsContainer } | Select-Object Name | Format-Table -AutoSize
            Write-Host ""
            Write-Host "Key modules check:"
            Write-Host "  hathor_cli exists: $(Test-Path "$internal\hathor_cli")"
            Write-Host "  hathor exists: $(Test-Path "$internal\hathor")"
            Write-Host "  hathorlib exists: $(Test-Path "$internal\hathorlib")"
            Write-Host "  base_library.zip exists: $(Test-Path "$internal\base_library.zip")"
            Write-Host "  python312.dll exists: $(Test-Path "$internal\python312.dll")"
            if (Test-Path "$internal\hathor_cli") {
              Write-Host ""
              Write-Host "  hathor_cli contents:"
              Get-ChildItem "$internal\hathor_cli" -Recurse | Select-Object FullName | Format-Table -AutoSize
            }
          } else {
            Write-Host "_internal directory NOT FOUND!"
          }

      - name: Build Tauri app
        run: npm run tauri build

      - name: Inspect NSIS output
        if: always()
        shell: pwsh
        run: |
          $nsisDir = "src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsisDir) {
            Write-Host "=== NSIS output ==="
            Get-ChildItem $nsisDir | Select-Object Name, Length | Format-Table -AutoSize
          }
          # Check the WiX/NSIS staging area for resource files
          $releaseDir = "src-tauri\target\release"
          Write-Host ""
          Write-Host "=== release dir: binaries/ ==="
          $relBin = "$releaseDir\binaries"
          if (Test-Path $relBin) {
            Get-ChildItem $relBin -Recurse | Select-Object FullName | Where-Object { $_.FullName -match "hathor" } | Format-Table -AutoSize
          } else {
            Write-Host "binaries/ not found in release dir"
          }
          Write-Host ""
          Write-Host "=== release dir top-level hathor-core* ==="
          Get-ChildItem $releaseDir -Filter "hathor-core*" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # Lint and test (runs quickly without needing binaries)
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-check-v2-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: nix develop --command npm ci

      # Frontend checks
      - name: ESLint
        run: nix develop --command npm run lint

      - name: TypeScript type check
        run: nix develop --command npm run typecheck

      - name: Frontend tests (Vitest)
        run: nix develop --command npm test

      - name: npm audit
        run: nix develop --command npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities (see log above)"

      # Rust checks
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Create stub binaries for Tauri build script
        run: |
          mkdir -p src-tauri/binaries src-tauri/explorer-dist src-tauri/wallet-headless-dist
          mkdir -p src-tauri/binaries/hathor-core-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/hathor-core-x86_64-unknown-linux-gnu/hathor-core
          touch src-tauri/binaries/cpuminer-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/node-x86_64-unknown-linux-gnu
          touch src-tauri/explorer-dist/.keep
          touch src-tauri/wallet-headless-dist/.keep
          mkdir -p src-tauri/binaries/tx-mining-service-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/tx-mining-service-x86_64-unknown-linux-gnu/tx-mining-service

      - name: Clippy
        run: nix develop --command cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: nix develop --command cargo test --manifest-path src-tauri/Cargo.toml --features tauri-app

      - name: Cargo audit
        run: nix develop --command bash -c "cargo install cargo-audit --quiet && cargo audit --file src-tauri/Cargo.lock"
        continue-on-error: true
