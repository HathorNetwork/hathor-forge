[package]
name = "hathor-forge"
version = "0.3.3"
description = "A Ganache-like local blockchain for Hathor Network developers"
authors = ["Hathor Labs"]
edition = "2021"
default-run = "hathor-forge"

[lib]
name = "hathor_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hathor-forge"
path = "src/main.rs"

[[bin]]
name = "hathor-forge-cli"
path = "src/cli_main.rs"

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
bip39 = "2.1"
getrandom = "0.2"
base64 = "0.22"
miniz_oxide = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
